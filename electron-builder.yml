appId: com.professorscreenshare.app
productName: Professor Screen Share
directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - package.json
  - resources/**/*

extraMetadata:
  version: 1.0.1

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Professor Screen Share
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
